name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4          # TODO: épinglez les versions actuelles (ou un SHA)
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -t . -v
      - name: Smoke test de la CLI installée (init -> doctor)
        shell: bash
        env:
          RJH_HOME: ${{ runner.temp }}/rjh-home
        run: |
          rjh --version
          rjh init --yes --title "accountant" --country FR --level mid
          rjh doctor --offline

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true               # non bloquant au départ ; retirez-le quand le dépôt est propre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install ruff
      - run: ruff check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
