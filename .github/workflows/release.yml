name: Release
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi                     # à créer dans Settings > Environments ; PyPI : Trusted Publisher pour ce dépôt
    permissions:
      id-token: write                     # publication « trusted » : aucun mot de passe ni jeton PyPI à stocker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
