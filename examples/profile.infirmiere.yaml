  location:
    eligible_regions: [FR]
    countries: [fr]
  languages: { spoken: { fr: native, en: B1 } }
scoring: { hot_threshold: 7.0, heuristic_min: 15 }
sources:
  enabled: [adzuna]
  options: { adzuna: { countries: [fr], where: "Lyon", max_results: 100 } }
llm: { provider: manual, language: fr }
candidate:
  summary: "Infirmière DE depuis 2 ans, service d'urgences adultes puis pédiatrie."
